name: Deploy marketplace Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-marketplace-worker.yml"
      - "marketplace/catalog/**"
      - "marketplace/config.json"
      - "marketplace-worker/**"
      - "scripts/marketplace-worker.test.mjs"
      - "scripts/render-marketplace-worker-config.mjs"
      - "scripts/render-marketplace-worker-config.test.mjs"
      - "scripts/validate-marketplace.mjs"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: marketplace-worker-sandbox
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify marketplace source
        run: npm run build:ci

  deploy:
    if: vars.MARKETPLACE_WORKER_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: marketplace-sandbox
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Prepare disabled sandbox configuration
        env:
          MARKETPLACE_D1_DATABASE_ID: ${{ vars.MARKETPLACE_D1_DATABASE_ID }}
          MARKETPLACE_KV_NAMESPACE_ID: ${{ vars.MARKETPLACE_KV_NAMESPACE_ID }}
          MARKETPLACE_PAYPAL_MERCHANT_ID: ${{ vars.MARKETPLACE_PAYPAL_MERCHANT_ID }}
        run: node scripts/render-marketplace-worker-config.mjs

      - name: Deploy disabled sandbox Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: marketplace-worker
          wranglerVersion: "4.169.0"
          command: deploy --config wrangler.ci.jsonc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify fail-closed production route
        run: |
          response="$(curl --fail-with-body --retry 5 --retry-all-errors \
            --header 'Origin: https://ph7builder.com' \
            https://marketplace-api.ph7builder.com/v1/config)"
          jq -e '.enabled == false and .environment == "sandbox"' <<< "${response}"
