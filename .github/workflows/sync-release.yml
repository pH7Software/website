name: Sync latest pH7Builder release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Sync the latest stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-latest-release.mjs

      - name: Detect a release update
        id: changes
        run: |
          if git diff --quiet -- src/data/site.ts src/content/articles; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install website dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Verify the updated website
        if: steps.changes.outputs.changed == 'true'
        run: npm run build:ci

      - name: Commit the verified release update
        if: steps.changes.outputs.changed == 'true'
        run: |
          version="$(sed -n 's/.*latestRelease: "\([^"]*\)".*/\1/p' src/data/site.ts)"
          if [[ -z "${version}" ]]; then
            echo "Unable to read the synchronized release version." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/site.ts src/content/articles
          git commit -m "Publish pH7Builder ${version} release details"
          git push origin HEAD:main

      - name: Deploy the verified release update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
